<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoreo IoT - ESP32 & InfluxDB</title>

  <!-- CSS de Bootstrap (Layout y Grid) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Librería Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="container my-4">
    <!-- Encabezado -->
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">Sistema IoT - Monitoreo Ambiental</h2>
      <p class="text-muted">Cochabamba-Bolivia</p>
    </div>

    <!-- Tarjetas con valores actuales -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-6">
        <div class="card card-metric p-3 text-center bg-white border-start border-4 border-danger">
          <span class="text-muted small">Temperatura Actual</span>
          <div id="tempActual" class="metric-value text-danger">-- °C</div>
        </div>
      </div>
      <div class="col-6 col-md-6">
        <div class="card card-metric p-3 text-center bg-white border-start border-4 border-info">
          <span class="text-muted small">Humedad Actual</span>
          <div id="humActual" class="metric-value text-info">-- %</div>
        </div>
      </div>
    </div>

    <!-- Contenedor del Gráfico expandido horizontalmente -->
<div class="row">
  <div class="col-12">
    <div class="card p-4 shadow-lg mb-4">
      <h5 class="text-secondary mb-3">Historial en Tiempo Real</h5>
      
      <div class="canvas-wrapper">
        <canvas id="graficoSensor"></canvas>
      </div>
    </div>
  </div>
</div>

  <!-- Lógica JavaScript -->
  <script src="js/main.js"></script>
</body>
</html>
